[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-markdown-converter"
version = "1.3.0"
description = "Portable batch document conversion with fail-closed output planning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["markitdown>=0.1,<1"]

[project.scripts]
kingai-markdown = "convert:main"

[tool.setuptools]
py-modules = ["convert"]
